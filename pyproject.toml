[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-bot"
version = "0.1.0"
description = "Simple macOS bots for Old School RuneScape."
requires-python = ">=3.9"
dependencies = [
  "numpy==2.0.2",
  "opencv-python==4.12.0.88",
  "PyAutoGUI==0.9.54",
  "pyobjc-framework-Quartz==11.1",
]

[project.scripts]
osrs-bot = "src.cli:main"
combat = "src.cli:combat_entry"
fletching = "src.cli:fletching_entry"
magic = "src.cli:magic_entry"
hp = "src.cli:hp_entry"
calibrate-hp = "src.cli:calibrate_hp_entry"
calibrate-click = "src.cli:calibrate_click_entry"
auto-click = "src.auto_click:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
