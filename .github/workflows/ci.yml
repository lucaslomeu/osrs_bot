name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build OSRS Clicker
        run: |
          xcodebuild \
            -project OSRSClicker/OSRSClicker.xcodeproj \
            -scheme OSRSClicker \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/OSRSClickerDerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO
