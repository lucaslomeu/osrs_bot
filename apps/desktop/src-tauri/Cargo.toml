[package]
name = "osrs-clicker-desktop"
version = "0.1.0"
description = "OSRS Clicker desktop shell"
authors = ["OSRS Clicker"]
edition = "2021"

[lib]
name = "osrs_clicker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
